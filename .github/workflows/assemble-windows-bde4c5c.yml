name: Assemble Windows preview bde4c5c
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hjx249654541-oss/douzi-studio-downloads
    steps:
      - name: Download uploaded parts
        run: gh release download staging-windows-bde4c5c-20261115 --dir parts --pattern 'windows.part*'
      - name: Assemble and verify ZIP
        shell: python
        run: |
          import pathlib, hashlib, zipfile
          parts = sorted(pathlib.Path('parts').glob('windows.part*'))
          assert len(parts) == 25, len(parts)
          output = pathlib.Path('Douzi-Studio-Windows-x64-preview-20261115-bde4c5c.zip')
          with output.open('wb') as target:
              for part in parts:
                  target.write(part.read_bytes())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          assert digest == 'deb203ea50eb23e05e9113e401a92f8d6ddb433ff8c98f343af63ee85d3de016', digest
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert 'douzi-cli.cmd' in z.namelist()
              assert 'resources/app/resources/bin/win32-x64/ffmpeg.exe' in z.namelist()
              assert 'resources/app/resources/skills/microfilm-video-pipeline/SKILL.md' in z.namelist()
          pathlib.Path('SHA256SUMS.txt').write_text(digest + '  ' + output.name + '\n')
      - name: Upload verified package to draft
        run: gh release upload windows-preview-20261115-bde4c5c Douzi-Studio-Windows-x64-preview-20261115-bde4c5c.zip SHA256SUMS.txt
