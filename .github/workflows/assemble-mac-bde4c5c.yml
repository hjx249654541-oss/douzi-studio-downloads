name: Assemble Mac arm64 preview bde4c5c
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: hjx249654541-oss/douzi-studio-downloads
    steps:
      - name: Download uploaded parts
        run: gh release download staging-mac-bde4c5c-20261115 --dir parts --pattern 'mac.part*'
      - name: Assemble and verify ZIP
        shell: python
        run: |
          import pathlib, hashlib, zipfile
          parts = sorted(pathlib.Path('parts').glob('mac.part*'))
          assert len(parts) == 25, len(parts)
          output = pathlib.Path('Douzi-Studio-mac-arm64-preview-20261115-bde4c5c.zip')
          with output.open('wb') as target:
              for part in parts:
                  target.write(part.read_bytes())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          assert digest == 'fd7ccfcc11978e286eb40edbd7f953be938268d42d238d7dba253b27816c9d77', digest
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert any(n.endswith('/Contents/MacOS/逗子制片所') for n in z.namelist())
              assert any(n.endswith('/Contents/Resources/app/server/agnes-proxy.mjs') for n in z.namelist())
          pathlib.Path('SHA256SUMS.txt').write_text(digest + '  ' + output.name + '\n')
      - name: Upload verified package to draft
        run: gh release upload mac-arm64-preview-20261115-bde4c5c Douzi-Studio-mac-arm64-preview-20261115-bde4c5c.zip SHA256SUMS.txt
